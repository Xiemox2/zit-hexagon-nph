[package]
name = "thpp"
version = "1.1.0"
edition = "2021"
description = "THPP 1.1: HPPT + THPP unificados. 31 idiomas, cinta original (ids 0.9/0.3/1.0 sin cambios), modo eager o lazy, roundtrip exacto."
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
unicode-normalization = "0.1"

[[bin]]
name = "thpp"
path = "src/bin/thpp.rs"

[[bin]]
name = "thpp-tool"
path = "src/bin/thpp-tool.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
